; Read Fuel Level - Komatsu HD785
; Board: Arduino Mega 2560 (ATmega2560)

[platformio]
default_envs = megaatmega2560

[env]
platform = atmelavr@5.2.0
board = megaatmega2560
framework = arduino
build_flags = -Wall -Wextra
test_framework = unity

; Firmware untuk board fisik
;   pio run -t upload        -> build & upload
;   pio device monitor       -> lihat output Serial
;   pio test -e megaatmega2560  -> jalankan unit test di board fisik (board harus terhubung)
[env:megaatmega2560]
monitor_speed = 115200
test_speed = 115200

; Unit test di simulator AVR (tanpa board)
;   pio test -e simavr
[env:simavr]
platform_packages = platformio/tool-simavr
build_flags = ${env.build_flags} -D SIMULATOR
; Cegah firmware test ter-upload ke board yang kebetulan terhubung
upload_protocol = custom
upload_command = echo Simulator: upload dilewati
test_speed = 9600
test_testing_command =
    ${platformio.packages_dir}/tool-simavr/bin/simavr
    -m
    atmega2560
    -f
    16000000L
    ${platformio.build_dir}/${this.__env__}/firmware.elf
